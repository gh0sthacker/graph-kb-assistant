# Private routed LAN vhost for the Graph KB Assistant on CT 108.
# Install as /etc/nginx/sites-available/graph-kb-assistant and disable the
# generic default site before reloading Nginx. Do not expose this HTTP service
# on the public Internet.
server {
    listen 80 default_server;
    listen 8080 default_server;
    server_name _;

    allow 192.168.1.0/24;
    deny all;

    auth_basic "Graph KB Assistant";
    auth_basic_user_file /etc/nginx/graph-kb-assistant.htpasswd;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8765;
        proxy_set_header Origin http://127.0.0.1:8765;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
