name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 ./...
      - run: go vet ./...
      - name: Build and identify Linux runtime binary
        env:
          CGO_ENABLED: "0"
          GOARCH: amd64
          GOOS: linux
        run: |
          release_dir="${RUNNER_TEMP}/bb-assistant-release"
          mkdir -p "$release_dir"
          binary="${release_dir}/bb-assistant-linux-amd64"
          go build -trimpath -buildvcs=true -o "$binary" ./cmd/bb-assistant
          version="$($binary version)"
          expected="0.1.0-go-dev+${GITHUB_SHA:0:12}"
          test "$version" = "$expected"
          (
            cd "$release_dir"
            sha256sum bb-assistant-linux-amd64 > SHA256SUMS
          )
      - name: Publish commit-pinned runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: bb-assistant-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/bb-assistant-release/
          if-no-files-found: error
          retention-days: 30

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[kb,mcp,test]"
      - run: python -m pytest -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan checked-out files with Gitleaks
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo:ro" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir --redact --no-banner --exit-code 1 /repo
