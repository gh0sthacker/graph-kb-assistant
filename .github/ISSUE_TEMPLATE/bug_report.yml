name: Bug report
description: Report a reproducible defect in BB Graph Assistant.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include raw captures, credentials, tokens, private hostnames, or personal data. Use synthetic examples.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal example using synthetic or licensed data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Go/Python version, and relevant Caido version. Do not include project IDs or secrets.
    validations:
      required: false
